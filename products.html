<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/products.js" defer></script>
    <title>Products catalog</title>
</head>

<body>
    <header>
        <nav>

        </nav>
    </header>

    <main>
        <nav class="breadcrumbs container">
            <a href="index.html">home</a>
            <span>&gt;</span>
            <span>all products</span>
        </nav>

        <div class="sort-filter-wrapper container">
            <button type="button" id="open-filter">
                filter(<span id="filter-count">0</span>)
            </button>

            <select id="sort-by-price">
                <option value="default">Sort by price</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
            </select>
        </div>

        <!--denna e gömd tills man klickar på filter knnappen-->
        <div id="filter-modal" class="filter-modal" hidden>
            <button type="button" id="close-filter">×</button>
            <h2>FILTER</h2>

            <select id="category">
                <option value="">All</option>
                <option value="smartphones">smartphones</option>
                <option value="laptops">laptops</option>
                <option value="fragrances">fragrances</option>
            </select>

            <button type="button" id="apply-filter">APPLY FILTER</button>
        </div>


        <section class="container">
            <div id="products-grid" class="products-grid">
                <!--NÄSTA GÅNG: stylea modal sidan, sorteraprodukter och produktkorten-->
                <!-- Produkt 1 -->
                <article class="product-card" data-category="smartphones" data-price="549">
                    <a href="product.html?id=1">
                        <img src="" alt="">
                    </a>
                    <div class="product-info">
                        <div>
                            <a href="product.html?id=1">iPhone 9</a>
                            <p>$549</p>
                        </div>
                        <div class="product-icons">
                            <button type="button">♡</button>
                            <button type="button">👜</button>
                        </div>
                    </div>
                </article>


                <!-- Produkt 2 -->
                <article class="product-card" data-category="smartphones" data-price="899">
                    <a href="product.html?id=2">
                        <img src="" alt="">
                    </a>
                    <div class="product-info">
                        <div>
                            <a href="product.html?id=2">iPhone X</a>
                            <p>$899</p>
                        </div>
                        <div class="product-icons">
                            <button type="button">♡</button>
                            <button type="button">👜</button>
                        </div>
                    </div>
                </article>


                <!-- Produkt 3 -->
                <article class="product-card" data-category="laptops" data-price="1749">
                    <a href="product.html?id=6">
                        <img src="" alt="">
                    </a>
                    <div class="product-info">
                        <div>
                            <a href="product.html?id=6">MacBook Pro</a>
                            <p>$1749</p>
                        </div>
                        <div class="product-icons">
                            <button type="button">♡</button>
                            <button type="button">👜</button>
                        </div>
                    </div>
                </article>


                <!-- Produkt 4 -->
                <article class="product-card" data-category="fragrances" data-price="13">
                    <a href="product.html?id=11">
                        <img src="" alt="">
                    </a>
                    <div class="product-info">
                        <div>
                            <a href="product.html?id=11">Perfume Oil</a>
                            <p>$13</p>
                        </div>
                        <div class="product-icons">
                            <button type="button">♡</button>
                            <button type="button">👜</button>
                        </div>
                    </div>
                </article>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Ecommerce Group Project</p>
    </footer>
</body>

</html>
