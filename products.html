<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/products.js"></script>
    <title>Products catalog</title>
</head>

<body>
    <header>
        <nav>
            <div class="nav-left">
                <button class="menu-btn">☰</button>
            </div>

            <div class="logo">
                <h2>MIN WEBBSIDA</h2>
            </div>

            <div class="nav-right">
                <a href="search.html">Sök</a>
                <a href="favorites.html">Sparade</a>
                <a href="cart.html">Kundkorg</a>
            </div>
            </div>

        </nav>
    </header>

    <main>
        <nav class="breadcrumbs container">
            <a href="index.html">Home</a>
            <span>&gt;</span>
            <span>All products</span>
        </nav>

        <div class="sort-filter-wrapper container">
            <button type="button" id="open-filter-btn" class="open-filter-btn">
                Filter<span id="filter-count"></span>
            </button>

            <select id="sort-by-price">
                <option value="default">Sort by price</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
            </select>
        </div>

        <!--denna e gömd tills man klickar på filter knnappen-->
        <div id="filter-modal" class="filter-modal">
            <div class="filter-header">
                <button type="button" id="close-filter-btn" class="close-filter-btn">&times;</button>
                <h2>Filter</h2>
            </div>

            <div class="filter-content">
                <h3>Categories</h3>

                <ul id="category-list" class="category-list">
                    <li>
                        <label>
                            <input type="checkbox" name="category" value="smartphones">
                            smartphones
                            <span class="category-count">[16]</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox" name="category" value="laptops">
                            laptops
                            <span class="category-count">[16]</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox" name="category" value="fragrances">
                            fragrances
                            <span class="category-count">[16]</span>
                        </label>
                    </li>
                </ul>

            </div>

            <div class="filter-footer">
                <button type="button" id="apply-filter-btn" class="apply-filter-btn">Apply filter</button>
            </div>
        </div>


        <section class="container">
            <div id="products-grid" class="products-grid">
                <!--NÄSTA GÅNG: Fixa så även krysset försvinner i add produkt modalen, sedan Läs in produkter från API-->
                <!-- Produkt 1 -->
                <article class="product-card" data-category="smartphones" data-price="549">
                    <a href="product.html?id=1">
                        <img src="" alt="">
                    </a>
                    <div class="product-info">
                        <div class="product-info-text">
                            <a href="product.html?id=1">iPhone 9</a>
                            <p>$549</p>
                        </div>
                        <div class="product-info-icons">
                            <button type="button">♡</button>
                            <button type="button">👜</button>
                        </div>
                    </div>
                </article>


                <!-- Produkt 2 -->
                <article class="product-card" data-category="smartphones" data-price="899">
                    <a href="product.html?id=2">
                        <img src="" alt="">
                    </a>
                    <div class="product-info">
                        <div class="product-info-text">
                            <a href="product.html?id=2">iPhone X</a>
                            <p>$899</p>
                        </div>
                        <div class="product-info-icons">
                            <button type="button">♡</button>
                            <button type="button">👜</button>
                        </div>
                    </div>
                </article>


                <!-- Produkt 3 -->
                <article class="product-card" data-category="laptops" data-price="1749">
                    <a href="product.html?id=6">
                        <img src="" alt="">
                    </a>
                    <div class="product-info">
                        <div class="product-info-text">
                            <a href="product.html?id=6">MacBook Pro</a>
                            <p>$1749</p>
                        </div>
                        <div class="product-info-icons">
                            <button type="button">♡</button>
                            <button type="button">👜</button>
                        </div>
                    </div>
                </article>


                <!-- Produkt 4 -->
                <article class="product-card" data-category="fragrances" data-price="13">
                    <a href="product.html?id=11">
                        <img src="" alt="">
                    </a>
                    <div class="product-info">
                        <div class="product-info-text">
                            <a href="product.html?id=11">Perfume Oil</a>
                            <p>$13</p>
                        </div>
                        <div class="product-info-icons">
                            <button type="button">♡</button>
                            <button type="button">👜</button>
                        </div>
                    </div>
                </article>
            </div>
        </section>

        <section class="pagination container">
            <!-- Fixa denna typ sist, inte med sidor dock vill ha laddning när man scrollar nerr -->
            <button type="button" id="prev-page-btn" class="prev-page-btn">Previous</button>
            <button type="button" id="next-page-btn" class="next-page-btn">Next</button>
        </section>

        <button type="button" id="open-create-btn" class="open-create-btn" aria-label="Add product">+</button>
        <div id="create-modal" class="create-modal">
            <div class="create-header">
                <button type="button" id="close-create-btn" class="close-create-btn">&times;</button>
                <h2>Add product</h2>
            </div>
            <form id="create-product-form" class="product-form">
                <label>
                    Title
                    <input type="text" name="title" required>
                </label>
                <label>
                    Brand
                    <input type="text" name="brand">
                </label>
                <label>
                    Price
                    <input type="number" name="price" min="0" step="0.01" required>
                </label>
                <label>
                    Category
                    <input type="text" name="category" required>
                </label>
                <label>
                    Description
                    <textarea name="description" rows="4"></textarea>
                </label>
                <div class="product-form-actions">
                    <button type="submit" class="save-btn">Add product</button>
                    <button type="button" id="cancel-create-btn" class="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Ecommerce Group Project</p>
    </footer>
</body>

</html>
