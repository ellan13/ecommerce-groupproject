
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Home</title>
</head>

<body>

    <!-- Header -->
    <header>
        <nav class="navbar">

            <div class="nav-left">
                <button class="menu-btn">☰</button>
            </div>

            <div class="logo">
                <h2>MY WEBSITE</h2>
            </div>

            <div class="nav-right">
                <a href="search.html">Search</a>
                <a href="favorites.html">Favorites</a>
                <a href="cart.html">Cart</a>
            </div>

        </nav>
    </header>

    <!-- Main -->
    <main>

        <!-- Hero image -->
        <section class="hero-section container">

            <img src="images/news-banner.jpg" alt="Latest news">

        </section>

        <!-- News section -->
        <section class="news-section container">

            <h2>News</h2>

            <div class="product-container">

                <article class="product-card">
                    <img src="images/news1.jpg" alt="News">
                </article>

                <article class="product-card">
                    <img src="images/news2.jpg" alt="News">
                </article>

                <article class="product-card">
                    <img src="images/news3.jpg" alt="News">
                </article>

            </div>

        </section>

        <!-- Best Sellers section -->
        <section class="bestseller-section container">

            <h2>Best Sellers</h2>

            <div class="product-container">

                <article class="product-card">
                    <img src="images/bestseller1.jpg" alt="Best seller">
                </article>

                <article class="product-card">
                    <img src="images/bestseller2.jpg" alt="Best seller">
                </article>

                <article class="product-card">
                    <img src="images/bestseller3.jpg" alt="Best seller">
                </article>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Ecommerce Group Project</p>
    </footer>

</body>

</html>
