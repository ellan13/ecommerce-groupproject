<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css" />

    <title>My Website</title>
  </head>

  <body>
    <!-- Header -->
    <header>
      <nav class="navbar">
        <div class="nav-left">
          <button class="menu-btn" id="open-menu-btn" aria-label="Open menu">
            ☰
          </button>
        </div>

        <a href="index.html" class="logo">MY WEBSITE</a>

        <div class="nav-right">
          <button class="search-btn" id="search-btn" aria-label="Search">
            🔍
          </button>
          <a href="favorites.html" aria-label="Favorites">♡</a>
          <a href="cart.html" class="cart-link" aria-label="Cart">
            🛍<span id="cart-badge" class="cart-badge" hidden>0</span>
          </a>
        </div>
      </nav>

      <!-- Sökruta (dold tills man klickar på 🔍) -->
      <div class="search-panel" id="search-panel">
        <form id="search-form" class="search-form">
          <input
            type="search"
            id="search-input"
            placeholder="Search products"
            autocomplete="off"
          />
        </form>

        <p id="search-message"></p>
        <div class="products-grid" id="search-results"></div>
      </div>

      <!-- Menu overlay (dold tills man klickar på ☰) -->
      <div class="menu-modal" id="menu-modal">
        <button
          class="close-menu-btn"
          id="close-menu-btn"
          aria-label="Close menu"
        >
          ✕
        </button>
        <h2>Categories</h2>
        <ul class="menu-list">
          <li><a href="products.html">Shop all</a></li>
          <li><a href="products.html?category=beauty">Beauty</a></li>
          <li><a href="products.html?category=electronics">Electronics</a></li>
          <li><a href="products.html?category=furniture">Furniture</a></li>
        </ul>
      </div>
    </header>

    <!-- Main -->
    <main>
      <!-- Hero section -->
      <section class="hero-section container">
        <div id="hero-content">
          <p>Loading product...</p>
        </div>
      </section>

      <!-- News -->
      <section class="home-section container">
        <h2>News</h2>

        <div id="news-grid" class="home-grid">
          <p>Loading products...</p>
        </div>
      </section>

      <!-- Best Sellers -->
      <section class="home-section container">
        <h2>Best Sellers</h2>

        <div id="best-sellers-grid" class="home-grid">
          <p>Loading products...</p>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 Ecommerce Group Project</p>
    </footer>

    <!-- JavaScript -->
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/home.js"></script>
  </body>
</html>
