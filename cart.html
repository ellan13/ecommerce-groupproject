<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/cart.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <title>Document</title>
</head>

<body>
    <!-- Header -->
    <header>
        <nav class="navbar">
            <div class="nav-left">
                <button class="menu-btn" id="open-menu-btn" aria-label="Open menu">☰</button>
            </div>

            <a href="index.html" class="logo">MY WEBSITE</a>

            <div class="nav-right">
                <a href="search.html" aria-label="Search">🔍</a>
                <a href="favorites.html" aria-label="Favorites">♡</a>
                <a href="cart.html" aria-label="Cart">🛍</a>
            </div>
        </nav>

        <!-- Menu overlay (dold tills man klickar på ☰) -->
        <div class="menu-modal" id="menu-modal">
            <button class="close-menu-btn" id="close-menu-btn" aria-label="Close menu">✕</button>
            <h2>Categories</h2>
            <ul class="menu-list">
                <li><a href="products.html">Shop all</a></li>
                <li><a href="products.html">Category 1</a></li>
                <li><a href="products.html">Category 2</a></li>
                <li><a href="products.html">Category 3</a></li>
            </ul>
        </div>
    </header>

    <main>
        <section class="container cart-page">
            <h1>Shopping cart</h1>

            <p id="cart-status" role="status" hidden></p>

            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody id="cart-items">

                    <tr id="cart-empty" hidden>
                        <td colspan="4" class="cart-empty">Your cart is empty</td>
                    </tr>

                    <!-- Läggs in med JavaScript -->
                </tbody>

            </table>

            <p class="cart-summary">Total: <strong id="cart-total">0 kr</strong></p>

            <button id="checkout-button" type="button">Place order</button>

            <a class="back-to-shopping" href="products.html" id="back-link">Back to shopping</a>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ecommerce Group Project</p>
    </footer>
</body>

</html>
