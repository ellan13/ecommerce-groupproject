<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/cart.js"></script>
    <title>Document</title>

<body>
    <header>

            <div class="nav-left">

            </div>

            <div class="logo">

            </div>

            <div class="nav-right">

            </div>

        <section class="container cart-page">
            <h1>Shopping cart</h1>

            <table class="cart-table">

                    <tr>
                        <th>Product</th>
                        <th>Price</th>

            <button id="checkout-button" type="button">Place order</button>

            <a class="back-to-shopping" href="products.html" id="back-link">Back to shopping</a>

        </section>
