<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/favorites.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <title>Document</title>
  </head>

  <body>
    <!-- Header -->
    <!-- Header -->
    <header>
      <nav class="navbar">
        <div class="nav-left">
          <button class="menu-btn" id="open-menu-btn" aria-label="Open menu">
            ☰
          </button>
        </div>

        <a href="index.html" class="logo">MY WEBSITE</a>

        <div class="nav-right">
          <button class="search-btn" id="search-btn" aria-label="Search">
            🔍
          </button>
          <a href="favorites.html" aria-label="Favorites">♡</a>
          <a href="cart.html" aria-label="Cart">🛍</a>
        </div>
      </nav>

      <!-- Sökruta (dold tills man klickar på 🔍) -->
      <div class="search-panel" id="search-panel">
        <form id="search-form" class="search-form">
          <input
            type="search"
            id="search-input"
            placeholder="Search products"
            autocomplete="off"
          />
        </form>

        <p id="search-message"></p>
        <div class="products-grid" id="search-results"></div>
      </div>

      <!-- Menu overlay (dold tills man klickar på ☰) -->
      <div class="menu-modal" id="menu-modal">
        <button
          class="close-menu-btn"
          id="close-menu-btn"
          aria-label="Close menu"
        >
          ✕
        </button>
        <h2>Categories</h2>
        <ul class="menu-list">
          <li><a href="products.html">Shop all</a></li>
          <li><a href="products.html">Category 1</a></li>
          <li><a href="products.html">Category 2</a></li>
          <li><a href="products.html">Category 3</a></li>
        </ul>
      </div>
    </header>

    <main>
      <section class="container favorites-page">
        <h1>Favorites</h1>

        <p id="favorites-empty" hidden>You haven’t added any favorites yet</p>

        <ul id="favorite-items">
          <!-- Läggs in med JavaScript -->

          <li class="favorite-item">
            <div class="favorite-image"></div>

            <div class="favorite-info">
              <p>T-shirt</p>
              <button type="button" class="remove-product-btn">Remove</button>
            </div>
          </li>
        </ul>

        <a
          class="back-to-shopping"
          href="products.html"
          id="back-link"
          class="go-back-link"
          >Back to shopping</a
        >
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Ecommerce Group Project</p>
    </footer>
  </body>
</html>
